apiVersion: apps/v1
kind: Deployment
metadata:
  name: iisa
  namespace: subgraph-dips-indexer-selection-iisa-daily-cronjob-samuel
  labels:
    app: iisa
spec:
  replicas: 1
  # The scores cache volume attaches to 1 node at a time, so a rolling update whose new pod
  # lands on another node waits on the old pod forever. Stop the old pod first instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iisa
  template:
    metadata:
      labels:
        app: iisa
    spec:
      # The service never calls the Kubernetes API, so it has no use for a service account token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: github-registry-secret
      containers:
        - name: iisa
          image: ghcr.io/graphprotocol/subgraph-dips-indexer-selection:v2.14.0 # x-release-please-version
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: IISA_HOST
              value: "0.0.0.0"
            - name: IISA_PORT
              value: "8080"
            - name: IISA_LOG_LEVEL
              value: "INFO"
            - name: SCORES_FILE_PATH
              value: "/app/scores/indexer_scores.json"
            - name: IISA_PUSH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iisa-push-token
                  key: IISA_PUSH_TOKEN
            - name: IISA_REQUIRE_PUSH_TOKEN
              value: "true"
            # Optional, so the service still starts without the secret: reads then need the
            # push token, as before.
            - name: IISA_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iisa-read-token
                  key: IISA_READ_TOKEN
                  optional: true
            # Optional. With both set, the service checks a candidate's claim to have synced a
            # deployment through the gateway before the claim can win it a place, 1 paid query
            # for each check. Without the secret every claim is taken on trust, as before. With
            # only 1 of the 2 keys the service refuses to start.
            - name: IISA_SYNC_CHECK_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: iisa-sync-check-gateway
                  key: IISA_SYNC_CHECK_GATEWAY_URL
                  optional: true
            - name: IISA_SYNC_CHECK_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iisa-sync-check-gateway
                  key: IISA_SYNC_CHECK_GATEWAY_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              # GKE Autopilot lowers the disk limit to match this request, so the request sets the cap.
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: scores
              mountPath: /app/scores
      volumes:
        - name: scores
          persistentVolumeClaim:
            claimName: iisa-scores-cache
