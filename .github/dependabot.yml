version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Service deps: pyproject.toml and uv.lock. "increase" also raises each minimum, which
  # changes pyproject.toml and so stops the service image reusing its cached install.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    # Majors stay out of the group, so 1 breaking release can't hold up the rest.
    groups:
      service-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The cronjob's tests install this list and pyproject.toml, which share pandas, numpy and pyarrow,
  # so a major release both cap (e.g. pyarrow 26) fails CI until both caps go up together.
  # Each merged bump rebuilds the image, which then needs a manual kubectl apply (see CLAUDE.md).
  - package-ecosystem: pip
    directory: /cronjobs/compute_scores
    schedule:
      interval: weekly
    versioning-strategy: increase
    # Every update, majors included, goes in 1 weekly PR. With only ranges and no lock file,
    # Dependabot can't tell a major from a patch, so an update-types filter pushes each bump into
    # its own PR. The service group above can split because uv.lock holds exact versions.
    groups:
      cronjob-python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /cronjobs/compute_scores
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
