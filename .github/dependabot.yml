version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Service deps: pyproject.toml and uv.lock. "increase" also raises each minimum, which
  # changes pyproject.toml and so stops the service image reusing its cached install.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    # Majors stay out of the group, so 1 breaking release can't hold up the rest.
    groups:
      service-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Cronjob deps: the ranges in requirements.in and the lock compiled from them, requirements.txt.
  # Dependabot compiles the lock again with the options its first lines record. CI's cronjob tests
  # install the lock with pyproject.toml's ranges, and fail when a package the 2 share needs a
  # version the other refuses (e.g. pyarrow 26 against a <25 cap). Each merged bump rebuilds the
  # image, which then needs a manual kubectl apply.
  - package-ecosystem: uv
    directory: /cronjobs/compute_scores
    schedule:
      interval: weekly
    versioning-strategy: increase
    # As for the service: majors stay out of the group, since the lock holds exact versions.
    groups:
      cronjob-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /
      - /cronjobs/compute_scores
    schedule:
      interval: weekly
    # The images' Python must match .python-version, which CI tests on, and CI fails when they
    # differ. Moving to a new Python means changing both together and testing on it, by hand.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-images:
        patterns: ["*"]
