# Audits both python dependency trees (pyproject.toml and the cronjob's
# requirements.txt) for known CVEs on every PR and push to main.
name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pip-audit-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        # pip-audit checks the whole environment, including the runner's preinstalled
        # setuptools, so upgrade it or an old bundled copy fails the audit.
        run: |
          pip install --upgrade setuptools
          pip install -e ".[dev]" pip-audit==2.10.1

      - name: pip-audit
        # The project itself is installed as editable and is not published on PyPI, so skip it
        # instead of asking PyPI about it; PyPI sometimes answers that lookup with a 503.
        run: pip-audit --skip-editable

  pip-audit-cronjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: pip-audit
        run: pip-audit -r cronjobs/compute_scores/requirements.txt
