# Audits both python dependency trees (the service's uv.lock and the cronjob's
# requirements.txt) for known CVEs on every PR and push to main.
name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pip-audit-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.24"

      # Audits the exact versions in uv.lock, which the service image installs, rather than
      # what pip would pick today. The dev extra rides along, as it is part of the same lock.
      - name: List the locked dependencies
        run: |
          uv export --locked --extra dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/locked.txt"
          pip install pip-audit==2.10.1

      - name: pip-audit
        run: .github/scripts/pip-audit-with-retry.sh -r "$RUNNER_TEMP/locked.txt" --disable-pip --no-deps

  pip-audit-cronjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: pip-audit
        run: .github/scripts/pip-audit-with-retry.sh -r cronjobs/compute_scores/requirements.txt
