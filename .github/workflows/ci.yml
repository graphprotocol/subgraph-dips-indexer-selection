# The service is tested against uv.lock, the versions the OSV scan checks. Neither image reads
# that lock, so each part is also tested against what pip resolves for its image on the day:
# the service's tests on pyproject.toml's resolve, tests/cronjob on its requirements.txt's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo to lint, type-check, and
# test. Pinning the token to read-only matters once the repo is public, when
# anyone can open a pull request that triggers it.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.11"
          activate-environment: true

      # Fails when pyproject.toml has changed but uv.lock was not regenerated to match.
      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: ruff check src/ tests/ cronjobs/compute_scores/

      # Fails when any function's cognitive complexity (how hard it is to follow) passes 15.
      - name: Complexity
        run: complexipy src/ cronjobs/compute_scores/ --max-complexity-allowed 15 --failed --plain

      # tests/cronjob needs the cronjob's own dependencies, so the cronjob-tests job runs it.
      - name: Test
        run: pytest --tb=short -q --cov=src --cov-fail-under=75 --ignore=tests/cronjob

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.11"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # mypy checks the cronjob too, and only its requirements.txt lists its packages. Any
      # package the lock already satisfies is left at its locked version.
      - name: Install cronjob dependencies
        run: uv pip install -r cronjobs/compute_scores/requirements.txt

      - name: mypy
        run: mypy

  cronjob-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The same install the cronjob image's Dockerfile runs. The list of what it installed
      # lets the test tools step prove it left every one of those versions alone.
      - name: Install cronjob dependencies
        run: |
          pip install -r cronjobs/compute_scores/requirements.txt
          pip freeze > "$RUNNER_TEMP/cronjob-packages.txt"

      # The test tools add packages the image lacks (pydantic and pyyaml among them), so an
      # import only they satisfy would pass the tests and then crash the job in its image.
      - name: Check the cronjob imports only what its requirements install
        run: python -I .github/scripts/check_cronjob_imports.py cronjobs/compute_scores

      # The dev extra brings pytest, and the iisa package that the shared conftest imports.
      - name: Install test tools
        run: |
          pip install -e ".[dev]"
          changed=$(pip freeze | grep -vxFf - "$RUNNER_TEMP/cronjob-packages.txt" || true)
          if [ -n "$changed" ]; then
            echo "::error::Installing the test tools changed packages the cronjob image ships:"
            echo "$changed"
            exit 1
          fi

      - name: Test
        run: pytest tests/cronjob --tb=short -q

  service-image-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Matches the python:3.12-slim base of the service image's Dockerfile.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same pip install of pyproject.toml's dependencies that the service image runs, which
      # can pick newer versions than uv.lock holds.
      - name: Install service dependencies
        run: |
          pip install -e .
          pip freeze > "$RUNNER_TEMP/service-packages.txt"

      - name: Install test tools
        run: |
          pip install -e ".[dev]"
          changed=$(pip freeze | grep -vxFf - "$RUNNER_TEMP/service-packages.txt" || true)
          if [ -n "$changed" ]; then
            echo "::error::Installing the test tools changed packages the service image ships:"
            echo "$changed"
            exit 1
          fi

      - name: Test
        run: pytest --tb=short -q --ignore=tests/cronjob
