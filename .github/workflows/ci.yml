# The cronjob's requirements.txt is installed alongside the dev extras so its tests
# run against the same version ranges the cronjob image installs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo to lint, type-check, and
# test. Pinning the token to read-only matters once the repo is public, when
# anyone can open a pull request that triggers it.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" -r cronjobs/compute_scores/requirements.txt

      - name: Lint
        run: ruff check src/ tests/ cronjobs/compute_scores/

      # Fails when any function's cognitive complexity (how hard it is to follow) passes 15.
      - name: Complexity
        run: complexipy src/ cronjobs/compute_scores/ --max-complexity-allowed 15 --failed --plain

      - name: Test
        run: pytest --tb=short -q --cov=src --cov-fail-under=75

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy
