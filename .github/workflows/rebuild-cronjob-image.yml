name: Rebuild CronJob Image

on:
  push:
    branches:
      - main
    paths:
      - 'cronjobs/compute_scores/**'
      - '.github/workflows/rebuild-cronjob-image.yml'
  schedule:
    # Run weekly on Sundays at 00:00 UTC to comply with MaxMind's 30-day update requirement
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/subgraph-dips-indexer-selection-cronjob
  DOCKERFILE_PATH: cronjobs/compute_scores/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "sha_short=$SHA_SHORT"
            echo "sha_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHA_SHORT"
            echo "latest_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: cronjobs/compute_scores
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ steps.tags.outputs.latest_tag }}
            ${{ steps.tags.outputs.sha_tag }}
          # Passed via BuildKit secret mount, never recorded in any
          # image layer or in docker history output.
          secrets: |
            maxmind=${{ secrets.MAXMIND_LICENSE_KEY }}

      - name: Update CronJob image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="chore/update-cronjob-image-${{ steps.tags.outputs.sha_short }}"
          # Every manifest that runs this image moves together (today the CronJob and the
          # sync-status fetcher), so a new one is picked up without editing this step.
          MANIFESTS=()
          while IFS= read -r manifest; do
            MANIFESTS+=("$manifest")
          done < <(grep -rlF "image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:" k8s/)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "::error::no manifest under k8s/ uses ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}, so the new tag could not be written"
            exit 1
          fi
          for manifest in "${MANIFESTS[@]}"; do
            sed -i 's|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ steps.tags.outputs.sha_tag }}|' "$manifest"

            # sed succeeds even when nothing matches, so confirm the new tag was actually written
            if ! grep -qF "image: ${{ steps.tags.outputs.sha_tag }}" "$manifest"; then
              echo "::error::$manifest has no image under ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}, so the new tag could not be written"
              exit 1
            fi
          done

          # Check if there are actual changes
          if git diff --quiet "${MANIFESTS[@]}"; then
            echo "No changes to k8s yaml, skipping PR creation"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add "${MANIFESTS[@]}"
          git commit -m "chore(k8s): update cronjob image to sha-${{ steps.tags.outputs.sha_short }}" \
            -m "Updates every manifest that runs this image: ${MANIFESTS[*]}"
          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --title "chore(k8s): update cronjob image to sha-${{ steps.tags.outputs.sha_short }}" \
            --body "Updates the CronJob and the sync-status fetcher to use image \`${{ steps.tags.outputs.sha_tag }}\`

          **Merge order:** Land this **before** any open \`chore(main): release\` PR. After this lands, wait 1-2 minutes for release-please to force-push the release PR with the new SHA bump — otherwise you'll need to land a third PR.

          After merging, run:
          \`\`\`bash
          kubectl apply $(printf -- '-f %s ' "${MANIFESTS[@]}")
          \`\`\`"

      - name: Summary
        run: |
          {
            echo "## Docker Image Rebuilt"
            echo ""
            echo "- **Image**: \`${{ steps.tags.outputs.latest_tag }}\`"
            echo "- **SHA tag**: \`${{ steps.tags.outputs.sha_tag }}\`"
            echo "- **GeoLite2-City**: location lookups"
            echo "- **GeoLite2-ASN**: organization lookups"
            echo ""
            echo "This product includes GeoLite2 data created by MaxMind, available from https://www.maxmind.com"
          } >> "$GITHUB_STEP_SUMMARY"
