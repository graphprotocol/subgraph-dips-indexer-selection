name: Rebuild CronJob Image

on:
  push:
    branches:
      - main
    paths:
      - 'cronjobs/compute_scores/**'
      - '.github/workflows/rebuild-cronjob-image.yml'
      - '.github/scripts/update-cronjob-image.sh'
  schedule:
    # Run weekly on Sundays at 00:00 UTC to comply with MaxMind's 30-day update requirement
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger

# Two runs at once on the same main commit would race to push the same manifest update branch,
# so a new run waits for the one in progress. GitHub keeps only the newest waiting run, which is
# safe because pushes and the weekly schedule both build the latest main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/subgraph-dips-indexer-selection-cronjob
  DOCKERFILE_PATH: cronjobs/compute_scores/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "sha_short=$SHA_SHORT"
            echo "sha_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHA_SHORT"
            echo "latest_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: cronjobs/compute_scores
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ steps.tags.outputs.latest_tag }}
            ${{ steps.tags.outputs.sha_tag }}
          # Passed via BuildKit secret mount, never recorded in any
          # image layer or in docker history output.
          secrets: |
            maxmind=${{ secrets.MAXMIND_LICENSE_KEY }}

      - name: Update CronJob image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          NEW_IMAGE: ${{ steps.tags.outputs.sha_tag }}
          SHA_SHORT: ${{ steps.tags.outputs.sha_short }}
        run: .github/scripts/update-cronjob-image.sh

      - name: Summary
        run: |
          {
            echo "## Docker Image Rebuilt"
            echo ""
            echo "- **Image**: \`${{ steps.tags.outputs.latest_tag }}\`"
            echo "- **SHA tag**: \`${{ steps.tags.outputs.sha_tag }}\`"
            echo "- **GeoLite2-City**: location lookups"
            echo "- **GeoLite2-ASN**: organization lookups"
            echo ""
            echo "This product includes GeoLite2 data created by MaxMind, available from https://www.maxmind.com"
          } >> "$GITHUB_STEP_SUMMARY"
